<!doctype html>
<html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parent Wise Studio</title>
<style>
:root{--bg:#0f1116;--panel:#171a22;--card:#1d212b;--line:#2a2f3c;--ink:#e9ecf3;--mut:#8b92a5;--acc:#ff6a88;--acc2:#8b7bff;--ok:#2fb67c;--run:#f5a524;--wait:#5b8def;--err:#ef4f56}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,'Segoe UI',sans-serif;display:grid;grid-template-rows:56px 1fr;overflow:hidden}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;cursor:pointer}
button:hover{border-color:#3b4254}button.p{background:linear-gradient(135deg,#ff6a88,#ff8a5c);border:0;color:#fff;font-weight:600}
button.g{background:var(--ok);border:0;color:#fff;font-weight:600}button.d{border-color:#5a2a2e;color:#ff9096}button:disabled{opacity:.45}
header{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff9a8b,#ff6a88);display:grid;place-items:center;font-weight:800}
.brand{font-weight:700;font-size:16px}.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:12px;color:var(--mut)}.pill b{color:var(--ink)}
header .sp{flex:1}select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:inherit;max-width:420px}
.wrap{display:grid;grid-template-columns:360px 1fr 340px;min-height:0}
.left,.right{background:var(--panel);overflow:auto;min-height:0}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);padding:18px}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.tabs button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:13px 4px;border-bottom:2px solid transparent}.tabs button.on{color:var(--ink);border-color:var(--acc)}
.lp{padding:12px}.cand{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.cand .top{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:12px;color:var(--mut)}.score{width:26px;height:26px;border-radius:50%;background:var(--run);color:#111;font-weight:800;display:grid;place-items:center}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:#3a2530;color:#ff8fa3;text-transform:uppercase}.tag.evergreen{background:#1f3a2f;color:#5fd1a0}.tag.playbook{background:#2c2a4d;color:#a99bff}
.cand h3{font-size:15px;margin-bottom:6px}.cand p{color:#b6bccb;font-size:13px;margin-bottom:8px}.cand a{color:var(--acc2);font-size:12px;margin-right:8px}.why{background:#20242f;border-radius:8px;padding:6px 9px;color:var(--mut);font-size:12px;margin-bottom:8px}
.cand button{width:100%}
.canvasw{position:relative;overflow:auto;background:radial-gradient(circle at 1px 1px,#252a36 1px,transparent 0) 0 0/22px 22px}
.flowbar{display:flex;gap:8px;padding:14px 20px;align-items:center;position:sticky;top:0;z-index:3;background:linear-gradient(var(--bg),transparent)}
.flowbar .on{background:var(--acc2);border-color:var(--acc2)}.flowbar .lbl{color:var(--mut);margin-left:8px}
#canvas{position:relative;padding:8px 40px 60px;min-width:1000px}svg#wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.grp{margin-bottom:38px}.grp h4{font-size:12px;letter-spacing:.06em;margin:0 0 14px 4px;color:var(--ink)}.grp h4 span{color:var(--mut);font-weight:400;margin-left:8px}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:44px;margin-bottom:34px}
.node{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:11px;align-items:center;cursor:pointer;min-height:64px;z-index:1}
.node:hover{border-color:#4a5268}.node.sel{outline:2px solid #ff8a5c;outline-offset:2px}
.ico{flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:#2a2f3c}
.node .t{font-weight:700;font-size:13.5px}.node .s{color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.node.done,.node.approved{border-color:#245c47}.node.running{border-color:var(--run);animation:pulse 1.4s infinite}.node.waiting{border-color:var(--wait);animation:pulse2 1.4s infinite}.node.error{border-color:var(--err)}
.node.idle{opacity:.72}
.badge{position:absolute;top:-9px;right:-9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;color:#fff;font-weight:700}
.done .badge,.approved .badge{background:var(--ok)}.error .badge{background:var(--err)}.running .badge{background:var(--run)}.waiting .badge{background:var(--wait)}
.dot{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:#3a4155;transform:translateY(-50%)}.dot.l{left:-4px}.dot.r{right:-4px}
@keyframes pulse{50%{box-shadow:0 0 0 5px #f5a52422}}@keyframes pulse2{50%{box-shadow:0 0 0 5px #5b8def33}}
.wire{fill:none;stroke:#2f7a5d;stroke-width:2}.wire.off{stroke:#333a4b}
.right h2{font-size:17px;display:flex;gap:10px;align-items:center;margin-bottom:14px}.right h5{color:var(--mut);font-size:11px;letter-spacing:.08em;margin:16px 0 6px}
.st{font-size:13px}.st b{color:var(--ok)}pre{background:#0d0f14;border:1px solid var(--line);border-radius:10px;padding:10px;font:11.5px/1.5 Consolas,monospace;white-space:pre-wrap;max-height:300px;overflow:auto;color:#c9d0e0}
.imgs{display:flex;gap:6px;overflow:auto;padding-bottom:6px}.imgs img{height:150px;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}video{width:100%;max-height:340px;border-radius:10px;background:#000}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:50}.modal.on{display:grid}.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(720px,92vw);max-height:84vh;overflow:auto}
.mbox h3{margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
input,textarea{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
.raw{padding:9px 10px;border-bottom:1px solid var(--line);font-size:12.5px}.raw a{color:var(--ink);text-decoration:none;font-weight:600}.raw small{color:var(--mut);display:block}
.empty{color:var(--mut);padding:24px;text-align:center}
@media(max-width:1100px){.wrap{grid-template-columns:1fr}.left,.right{max-height:40vh}}
</style>
<header>
  <div class="logo">P</div><div class="brand">Parent Wise Studio</div>
  <span class="pill">Sonraki tarama <b id="next">-</b></span><span class="pill" id="apr" style="cursor:pointer" title="Onayı aç/kapat">Onay: <b>-</b></span>
  <div class="sp"></div>
  <select id="runsel"></select>
  <button id="bperf">📊 Performans</button><button id="btim">⏱ Süreler</button><button class="p" id="scan">⟳ Şimdi tara</button><button id="bset">⚙</button>
</header>
<div class="wrap">
  <div class="left">
    <div class="tabs"><button data-t="cand" class="on">Adaylar</button><button data-t="raw">Ham haberler</button><button data-t="viral">Viral</button><button data-t="hist">Geçmiş</button></div>
    <div class="lp" id="lp"></div>
  </div>
  <div class="canvasw">
    <div class="flowbar"><button data-f="post" class="on">🖼 Carousel akışı</button><button data-f="clip">🎬 Viral Reel akışı</button><span class="lbl" id="flbl"></span></div>
    <div id="canvas"><svg id="wires"></svg><div id="groups"></div></div>
  </div>
  <div class="right" id="rp"><div class="empty">Bir düğüme tıkla.</div></div>
</div>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const api=(p,b)=>fetch('/api/'+p,b!==undefined?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}).then(r=>r.json());
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const META={trigger:['⏰','Zamanlayıcı','#3a2a1e'],collect:['📰','Haber topla','#233247'],scout:['🧠','Ara, doğrula, sırala','#3a2440'],pick:['👤','Senin seçimin','#2c2a4d'],
 write:['✍️','Doğrula & yaz','#3a2f1e'],cover:['🖼','Kapak görseli','#1f3a3a'],carousel:['🎠','Carousel','#1f3a2f'],video:['🎞','Video · ses + müzik','#2c2a4d'],
 qa:['👁','Kalite kontrol','#3a2530'],approve:['✅','Yayından önce onay','#1f3a2f'],prepare:['📦','Hazırla','#233247'],upload:['☁️','Medya yükle','#233247'],
 ig_carousel:['📸','Instagram carousel','#3a2440'],ig_reel:['📸','Instagram Reel','#3a2440'],fb_photos:['📘','Facebook gönderi','#1e2f4a'],fb_reel:['📘','Facebook Reel','#1e2f4a'],
 yt_short:['▶️','YouTube Short','#4a1e22'],log:['🗂','Kayıt & GitHub','#3a3a1e'],fetch:['⬇️','Videoyu indir','#233247'],hook:['🪝','Hook + açıklama','#3a2f1e'],frame:['🎬','Reel çerçevesi','#2c2a4d']};
const GROUPS={post:[['1','TARAMA','scan',['trigger','collect','scout','pick']],['2','CAROUSEL ÜRETİMİ','post',['write','cover','carousel','video']],
  ['3','KONTROL, ONAY & YAYIN','post',['qa','approve','prepare','upload','ig_carousel','fb_photos','yt_short','log']]],
  clip:[['1','VİRAL KLİP','clip',['fetch','hook','frame','qa','approve','prepare','upload','ig_reel','fb_reel','log']]]};
let S={runs:[]},flow='post',ltab='cand',sel=null,cur={post:null,clip:null},runs={},lastHash='';
const ST={idle:'boşta',running:'çalışıyor',waiting:'seni bekliyor',done:'tamamlandı',approved:'onaylandı',error:'hata'};
const BADGE={done:'✓',approved:'✓',error:'!',running:'…',waiting:'⏸'};

async function refresh(){
  S=await api('state');
  $('#next').textContent=S.next_scan;$('#apr').innerHTML='Onay: <b>'+(S.settings.approval?'açık':'kapalı')+'</b>';
  const kinds=S.runs.filter(r=>r.kind===flow);
  const sel_=$('#runsel');sel_.innerHTML=kinds.length?kinds.map(r=>`<option value="${r.id}" ${r.id===cur[flow]?'selected':''}>${r.status==='done'?'✓':r.status==='error'?'✗':'●'} ${esc(r.post||r.id)}</option>`).join(''):'<option>(çalışma yok)</option>';
  if(!cur[flow]||!kinds.find(r=>r.id===cur[flow]))cur[flow]=kinds[0]?.id||null;
  runs={};const need=new Set();
  if(cur[flow])need.add(cur[flow]);
  for(const id of need)runs[id]=await api('run?id='+id);
  let scanId=flow==='post'?(runs[cur.post]?.scan||S.runs.find(r=>r.kind==='scan')?.id):null;
  if(flow==='post'&&scanId&&!runs[scanId])runs[scanId]=await api('run?id='+scanId);
  runs._scan=scanId;
  const h=JSON.stringify([S.runs,Object.values(runs).map(r=>r&&r.nodes),sel,ltab==='x']);
  if(h!==lastHash){lastHash=h;renderCanvas();renderRight();}
  if(ltab==='cand'&&!$('#lp').dataset.on)renderLeft();
}
function nodeState(run,name){
  const n=run?.nodes?.[name];
  if(!n&&name==='trigger'&&run)return{status:'done',info:run.source||'elle'};
  return n||{status:'idle'};
}
function renderCanvas(){
  const runOf={post:runs[cur.post],clip:runs[cur.clip],scan:runs[runs._scan]};
  const g=$('#groups');g.innerHTML='';
  GROUPS[flow].forEach(([num,title,rk,names])=>{
    const run=runOf[rk]||(rk==='clip'?runs[cur.clip]:null);
    const sub=run?(run.post||run.id):'';
    const rows=[];for(let i=0;i<names.length;i+=4)rows.push(names.slice(i,i+4));
    g.insertAdjacentHTML('beforeend',`<div class="grp"><h4>${num} ${title}<span>${esc(sub)}</span></h4>${rows.map(r=>`<div class="row">${r.map(n=>{
      const st=nodeState(run,n),m=META[n]||['•',n,'#2a2f3c'];const isSel=sel&&sel.node===n&&sel.rk===rk;
      return `<div class="node ${st.status} ${isSel?'sel':''}" data-n="${n}" data-rk="${rk}"><span class="dot l"></span><span class="dot r"></span>
      ${BADGE[st.status]?`<span class="badge">${BADGE[st.status]}</span>`:''}<div class="ico" style="background:${m[2]}">${m[0]}</div>
      <div><div class="t">${m[1]}</div><div class="s">${esc(st.info||ST[st.status]||'')}${st.dur?' · '+st.dur+' sn':''}</div></div></div>`}).join('')}</div>`).join('')}</div>`);
  });
  $$('.node').forEach(el=>el.onclick=()=>{sel={node:el.dataset.n,rk:el.dataset.rk};lastHash='';refresh()});
  $('#flbl').textContent=flow==='clip'?'Linki Viral sekmesine yapıştır':'';
  requestAnimationFrame(wires);
}
function wires(){
  const svg=$('#wires'),cv=$('#canvas').getBoundingClientRect();svg.setAttribute('width',cv.width);svg.setAttribute('height',cv.height);
  const els=$$('.node');const R=els.map(e=>{const b=e.getBoundingClientRect();return{x1:b.left-cv.left,x2:b.right-cv.left,y:b.top-cv.top+b.height/2,t:b.top-cv.top,b:b.bottom-cv.top,ok:/done|approved/.test(e.className)}});
  const xr=Math.max(...R.map(r=>r.x2))+22,xl=Math.min(...R.map(r=>r.x1))-22;let d='';
  for(let i=0;i<R.length-1;i++){const a=R[i],b=R[i+1],c=a.ok?'wire':'wire off';
    if(Math.abs(a.y-b.y)<5)d+=`<path class="${c}" d="M${a.x2} ${a.y}H${b.x1}"/>`;
    else{const ym=(a.b+b.t)/2;d+=`<path class="${c}" d="M${a.x2} ${a.y}H${xr}V${ym}H${xl}V${b.y}H${b.x1}"/>`}}
  svg.innerHTML=d;
}
addEventListener('resize',wires);
async function renderRight(){
  const rp=$('#rp');if(!sel){rp.innerHTML='<div class="empty">Bir düğüme tıkla.</div>';return}
  const run=sel.rk==='scan'?runs[runs._scan]:sel.rk==='clip'?runs[cur.clip]:runs[cur.post];
  if(!run){rp.innerHTML='<div class="empty">Bu akış için henüz çalışma yok.</div>';return}
  const st=nodeState(run,sel.node),m=META[sel.node]||['•',sel.node];
  let h=`<h2><span class="ico" style="width:32px;height:32px;font-size:17px">${m[0]}</span>${m[1]} <button style="margin-left:auto;padding:2px 9px" onclick="sel=null;lastHash='';refresh()">✕</button></h2>
   <h5>DURUM</h5><div class="st"><b>${ST[st.status]||st.status}</b>${st.dur?' · '+st.dur+' sn':''}${st.info?'<br>'+esc(st.info):''}${st.error?'<br><span style="color:var(--err)">'+esc(st.error)+'</span>':''}</div><div class="acts">`;
  if(st.status==='error'||run.status==='error')h+=`<button class="p" onclick="act('retry','${run.id}')">↻ Tekrar dene</button>`;
  if(run.status==='running')h+=`<button class="d" onclick="act('cancel','${run.id}')">İptal</button>`;
  if(sel.node==='approve'&&st.status==='waiting')h+=`<button class="g" onclick="act('approve','${run.id}')">Yayınla</button><button onclick="rev('${run.id}')">Revize et</button><button class="d" onclick="act('reject','${run.id}')">Reddet</button>`;
  h+='</div>';
  if(['approve','qa','video','carousel','cover','write','frame'].includes(sel.node)&&run.post){
    const a=await api('artifacts?id='+run.id),base='/file/'+run.post+'/';
    const sl=a.files.filter(f=>/^slide_\d+\.png$/.test(f));
    if(sl.length)h+=`<h5>SLAYTLAR</h5><div class="imgs">${sl.map(f=>`<img src="${base}${f}" onclick="window.open(this.src)">`).join('')}</div>`;
    if(a.files.includes('reel.mp4'))h+=`<h5>VİDEO</h5><video controls src="${base}reel.mp4"></video>`;
    if(a.content?.caption)h+=`<h5>AÇIKLAMA</h5><pre>${esc(a.content.caption)}</pre>`;
    if(a.write)h+=`<h5>TEYİT EDİLENLER</h5><pre>${esc((a.write.verified||[]).join('\n'))||'-'}</pre><h5>ÇIKARILANLAR</h5><pre>${esc((a.write.left_out||[]).join('\n'))||'-'}</pre>`;
    if(a.qa)h+=`<h5>QA</h5><pre>${a.qa.ok?'✓ ':'✗ '}${esc(a.qa.summary_tr||'')}\n${esc((a.qa.problems||[]).join('\n'))}</pre>`;
  }
  const lg=await api(`log?id=${run.id}&node=${sel.node}`);
  h+=`<h5>LOG</h5><pre>${esc(lg.log||'(log yok)')}</pre>`;
  rp.innerHTML=h;
}
async function renderLeft(){
  const lp=$('#lp');lp.dataset.on='';
  if(ltab==='cand'){
    const scans=await api('scans');if(!scans.length){lp.innerHTML='<div class="empty">Henüz aday yok. “Şimdi tara”.</div>';return}
    const file=lp.dataset.file&&scans.find(s=>s.file===lp.dataset.file)?lp.dataset.file:scans[0].file;lp.dataset.file=file;
    const d=await api('candidates?file='+encodeURIComponent(file));
    const scanRun=S.runs.find(r=>r.kind==='scan'&&r.status==='waiting')||S.runs.find(r=>r.kind==='scan');
    lp.innerHTML=`<select id="scsel" style="width:100%;margin-bottom:12px">${scans.map(s=>`<option value="${s.file}" ${s.file===file?'selected':''}>${s.label} · ${s.count} aday</option>`).join('')}</select>`+
     (d.candidates||[]).map((c,i)=>`<div class="cand"><div class="top"><span class="score">${c.score}</span><span class="tag ${c.kind}">${c.kind==='news'?'HABER':c.kind}</span><span>${esc(c.area||'')}</span><span style="margin-left:auto">${esc(c.published||'')}</span></div>
      <h3>${esc(c.title)}</h3><p>${esc(c.summary_tr)}</p>${c.why_tr?`<div class="why">💡 ${esc(c.why_tr)}</div>`:''}
      <div style="margin-bottom:8px">${(c.sources||[]).map(u=>`<a href="${esc(u)}" target="_blank">${esc(new URL(u).hostname)}</a>`).join('')}</div>
      <button class="p" onclick="pick('${scanRun?.id}','${c.id}')">Bu adayı seç</button></div>`).join('')+(d.notes_tr?`<div class="why">${esc(d.notes_tr)}</div>`:'');
    $('#scsel').onchange=e=>{lp.dataset.file=e.target.value;renderLeft()};
  }else if(ltab==='raw'){
    const r=await api('research');lp.innerHTML=(r.items||[]).map(i=>`<div class="raw"><a href="${esc(i.url)}" target="_blank">${esc(i.title)}</a><small>${esc(i.source)} · ${esc(i.tier)} · ${esc((i.date||'').slice(0,16))}</small></div>`).join('')||'<div class="empty">Ham haber yok.</div>';
  }else if(ltab==='viral'){
    const v=await api('viral');lp.innerHTML=`<input id="u" placeholder="X / Reddit / YouTube linki yapıştır"><p style="margin:8px 0 14px"><button class="p" onclick="clip()">Viral Reel başlat</button></p>`+
     v.map(x=>`<div class="raw"><a href="${esc(x.url)}" target="_blank">${esc(x.title)}</a><small>${esc(x.channel)} · ${x.views.toLocaleString()} izlenme</small></div>`).join('');
  }else{
    const h=await api('history');lp.innerHTML=h.slice().reverse().map(x=>`<div class="raw"><b>${esc(x.topic||x.post)}</b><small>${esc(x.date.slice(0,16))}</small>${['ig_url','ig_reel_url','fb_url','fb_reel_url','yt_url'].filter(k=>x[k]).map(k=>`<a href="${esc(x[k])}" target="_blank" style="color:var(--acc2);font-size:12px;margin-right:8px">${k.split('_')[0].toUpperCase()}</a>`).join('')}</div>`).join('')||'<div class="empty">Henüz yayın yok.</div>';
  }
}
$$('.tabs button').forEach(b=>b.onclick=()=>{$$('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');ltab=b.dataset.t;renderLeft()});
$$('.flowbar button').forEach(b=>b.onclick=()=>{$$('.flowbar button').forEach(x=>x.classList.remove('on'));b.classList.add('on');flow=b.dataset.f;sel=null;lastHash='';if(flow==='clip'){ltab='viral';$$('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t==='viral'));renderLeft()}refresh()});
$('#runsel').onchange=e=>{cur[flow]=e.target.value;sel=null;lastHash='';refresh()};
async function pick(scan,id){if(!scan||scan==='undefined')return alert('Önce bir tarama gerekli.');if(!confirm('Bu adayı seç? Akış başlayacak.'))return;const r=await api('select',{scan,candidate:id});if(r.error)return alert(r.error);cur.post=r.id;flow='post';sel=null;lastHash='';refresh()}
async function clip(){const u=$('#u').value.trim();if(!u)return;const r=await api('clip',{url:u});cur.clip=r.id;flow='clip';$$('.flowbar button').forEach(x=>x.classList.toggle('on',x.dataset.f==='clip'));lastHash='';refresh()}
async function act(a,id){await api(a,{id});lastHash='';refresh()}
async function rev(id){const note=prompt('Revizyon notu?');if(note){await api('revise',{id,note});lastHash='';refresh()}}
$('#scan').onclick=async()=>{await api('scan',{});lastHash='';refresh()};
$('#apr').onclick=async()=>{await api('settings',{approval:!S.settings.approval});refresh()};
const modal=h=>{$('#mbox').innerHTML=h;$('#modal').classList.add('on')};$('#modal').onclick=e=>{if(e.target.id==='modal')e.target.classList.remove('on')};
$('#bperf').onclick=async()=>{const m=await api('metrics');modal(`<h3>📊 Performans</h3><button onclick="api('metrics/refresh',{})">Yenile</button>${(m.needs||[]).length?`<p style="color:var(--mut);margin:10px 0">Eksik izinler:<br>${m.needs.map(esc).join('<br>')}</p>`:''}
 <table><tr><th>Post</th><th>IG reach</th><th>IG kaydet</th><th>YT izlenme</th></tr>${(m.posts||[]).map(p=>`<tr><td>${esc(p.topic||p.post)}</td><td>${p.instagram?.reach??'-'}</td><td>${p.instagram?.saved??'-'}</td><td>${p.youtube?.viewCount??'-'}</td></tr>`).join('')||'<tr><td colspan=4>Veri yok</td></tr>'}</table>`)};
$('#btim').onclick=async()=>{const t=await api('timings');modal(`<h3>⏱ Ortalama süreler</h3><table><tr><th>Düğüm</th><th>Ort. (sn)</th><th>Çalışma</th></tr>${Object.entries(t).map(([k,v])=>`<tr><td>${k}</td><td>${v.avg}</td><td>${v.n}</td></tr>`).join('')||'<tr><td colspan=3>Veri yok</td></tr>'}</table>`)};
$('#bset').onclick=()=>{const s=S.settings;modal(`<h3>⚙ Ayarlar</h3><p style="margin:8px 0">Tarama saatleri (virgülle)</p><input id="sl" value="${s.slots.join(', ')}"><p style="margin:14px 0 8px"><label><input type="checkbox" id="ap" style="width:auto" ${s.approval?'checked':''}> Yayından önce onay</label></p><button class="p" onclick="saveSet()">Kaydet</button>`)};
async function saveSet(){await api('settings',{slots:$('#sl').value.split(',').map(x=>x.trim()).filter(Boolean),approval:$('#ap').checked});$('#modal').classList.remove('on');refresh()}
renderLeft();refresh();setInterval(refresh,3000);
</script></html>
